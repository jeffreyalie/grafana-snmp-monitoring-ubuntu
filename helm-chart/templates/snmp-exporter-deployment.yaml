apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-snmp-exporter
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-snmp-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-snmp-exporter
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-snmp-exporter
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/snmp-exporter-config.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: snmp-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config.file=/etc/snmp_exporter/snmp.yml
            - --config.expand-environment-variables
            - --web.listen-address=:{{ .Values.exporter.port }}
          ports:
            - name: http
              containerPort: {{ .Values.exporter.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecretName }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/snmp_exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-snmp-exporter
