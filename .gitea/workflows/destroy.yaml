name: Destroy grafana-snmp-ubuntu

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true
        type: string
      delete_secret:
        description: 'Also delete the snmp-exporter-auth Secret'
        type: boolean
        default: true

env:
  RELEASE: grafana-snmp-ubuntu
  NAMESPACE: monitoring
  AUTH_SECRET: snmp-exporter-auth

jobs:
  uninstall:
    if: ${{ github.event.inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    env:
      VAULT_ADDR:      ${{ secrets.VAULT_ADDR }}
      VAULT_ROLE_ID:   ${{ secrets.VAULT_ROLE_ID }}
      VAULT_SECRET_ID: ${{ secrets.VAULT_SECRET_ID }}

    steps:
      - name: Install jq (if missing)
        run: command -v jq >/dev/null || (apt-get update -qq && apt-get install -y -qq jq)

      - uses: azure/setup-helm@v4
        with:
          version: 'v3.16.4'

      - uses: azure/setup-kubectl@v4

      - name: Fetch kubeconfig from OpenBao
        run: |
          set -euo pipefail
          T=$(curl -sk -X POST "${VAULT_ADDR}/v1/auth/approle/login" \
                -H "Content-Type: application/json" \
                -d "{\"role_id\":\"${VAULT_ROLE_ID}\",\"secret_id\":\"${VAULT_SECRET_ID}\"}" \
              | jq -r '.auth.client_token')
          if [ -z "$T" ] || [ "$T" = "null" ]; then echo "ERROR: OpenBao login failed"; exit 1; fi
          echo "::add-mask::$T"
          mkdir -p ~/.kube
          curl -sk -H "X-Vault-Token: $T" "${VAULT_ADDR}/v1/homelab/data/microk8s" \
            | jq -r '.data.data.kubeconfig // empty' > ~/.kube/config
          chmod 600 ~/.kube/config
          [ -s ~/.kube/config ] || { echo "ERROR: empty kubeconfig"; exit 1; }

      - name: Helm uninstall
        run: |
          helm uninstall "${RELEASE}" --namespace "${NAMESPACE}" --wait \
            || echo "Release not found, skipping."

      - name: Remove leftover dashboard ConfigMap
        run: kubectl delete configmap "${RELEASE}-dashboard" -n "${NAMESPACE}" --ignore-not-found

      - name: Delete auth Secret (if requested)
        if: ${{ github.event.inputs.delete_secret == 'true' }}
        run: kubectl delete secret "${AUTH_SECRET}" -n "${NAMESPACE}" --ignore-not-found

      - name: Show what remains
        if: always()
        run: |
          kubectl get deploy,svc,scrapeconfig,prometheusrule,configmap,secret -n "${NAMESPACE}" 2>/dev/null | grep -E "${RELEASE}|${AUTH_SECRET}" || echo "Nothing from ${RELEASE} left."

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f ~/.kube/config
